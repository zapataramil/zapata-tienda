<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago exitoso — ZAPATA Indumentaria</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      color: #0D0D0D;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .contenedor { max-width: 500px; }
    .check {
      width: 100px;
      height: 100px;
      background: #FF1493;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 0 auto 2rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .script {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #FF1493;
      margin-bottom: 1.5rem;
    }
    p { color: #666; margin-bottom: 2rem; line-height: 1.6; }
    a {
      display: inline-block;
      background: #FF1493;
      color: #fff;
      padding: 1rem 2.5rem;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    a:hover { background: #e0127e; }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="check">✓</div>
    <h1>Pago aprobado</h1>
    <p class="script">¡Gracias por tu compra!</p>
    <p>Tu pedido fue confirmado. En breve nos contactamos por WhatsApp para coordinar el envío a domicilio.</p>
    <a href="/">Volver a la tienda</a>
  </div>
</body>
</html>
